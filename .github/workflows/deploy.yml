name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:server
        env:
          NODE_ENV: production

      - name: Backend build complete
        if: success()
        run: |
          echo "::info::Backend build successful"
          echo "::notice::Frontend (web/) is auto-deployed to Vercel (getrizly.com)"
          echo "::notice::Backend (gateway/ai-core/worker) ready for manual GCP VM deploy"
          echo ""
          echo "To deploy backend:"
          echo "  ssh heyriz-vm"
          echo "  cd ~/heyriz && git pull origin main"
          echo "  make prod"
          echo ""
          echo "Docs: https://github.com/YOUR_REPO/blob/main/docs/devops.md"

      - name: Status notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build successful!**\n\n**Frontend:** Auto-deployed to Vercel (getrizly.com)\n**Backend:** Ready for deployment to GCP VM via:\n```bash\nssh heyriz-vm && cd ~/heyriz && git pull origin main && make prod\n```\n\nSee [docs/devops.md](../docs/devops.md) for details.'
            })

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Build failed. Please check the build logs.'
            })
