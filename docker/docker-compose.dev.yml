name: heyriz-dev

# Pin containers that make outbound calls (Google/OpenAI/Anthropic/Resend/Razorpay)
# to public resolvers. Docker otherwise snapshots the host's upstream DNS at
# container-create time, so switching networks (e.g. phone hotspot -> WiFi) leaves
# the old, now-unreachable nameserver cached and every external fetch dies with
# EAI_AGAIN ("fetch failed"). A fixed resolver survives host network changes.
x-external-dns: &external-dns
  - 8.8.8.8
  - 1.1.1.1

services:
  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile.dev
    dns: *external-dns
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      GATEWAY_PORT: 4000
      WEB_APP_URL: http://localhost:3000
      AI_CORE_TCP_HOST: ai-core
      AI_CORE_TCP_PORT: 4100
      BILLING_TCP_HOST: billing
      BILLING_TCP_PORT: 4200
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://heyriz:heyriz@postgres:5432/heyriz
      MONGODB_URL: mongodb://heyriz:heyriz@mongodb:27017/heyriz?authSource=admin
      GOOGLE_REDIRECT_URI: http://localhost:4000/api/connectors/google/callback
    ports:
      - "4000:4000"
    volumes:
      - ../apps/gateway/src:/app/apps/gateway/src
      - ../apps/gateway/public:/app/apps/gateway/public
      - ../shared/src:/app/shared/src
      - gateway_node_modules:/app/node_modules
    depends_on:
      - ai-core
      - billing
      - mongodb

  billing:
    build:
      context: ..
      dockerfile: apps/billing/Dockerfile.dev
    dns: *external-dns
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      BILLING_TCP_HOST: 0.0.0.0
      BILLING_TCP_PORT: 4200
      DATABASE_URL: postgres://heyriz:heyriz@postgres:5432/heyriz
    ports:
      - "4200:4200"
    volumes:
      - ../apps/billing/src:/app/apps/billing/src
      - ../shared/src:/app/shared/src
      - billing_node_modules:/app/node_modules
    depends_on:
      - postgres

  ai-core:
    build:
      context: ..
      dockerfile: apps/ai-core/Dockerfile.dev
    dns: *external-dns
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      AI_CORE_TCP_HOST: 0.0.0.0
      AI_CORE_TCP_PORT: 4100
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://heyriz:heyriz@postgres:5432/heyriz
    ports:
      - "4100:4100"
    volumes:
      - ../apps/ai-core/src:/app/apps/ai-core/src
      - ../shared/src:/app/shared/src
      - ai_core_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.dev
    dns: *external-dns
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      AI_CORE_TCP_HOST: ai-core
      AI_CORE_TCP_PORT: 4100
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://heyriz:heyriz@postgres:5432/heyriz
      # Without this the notification worker defaults to localhost:4000 (itself),
      # chatId resolution fails, and every reminder falls back to email.
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:4000
    volumes:
      - ../apps/worker/src:/app/apps/worker/src
      - ../shared/src:/app/shared/src
      - worker_node_modules:/app/node_modules
    depends_on:
      - redis
      - ai-core

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6381: 6379 on this machine is taken by another project's
      # redis. Services reach redis at redis:6379 inside the compose network.
      - "6381:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: heyriz
      POSTGRES_PASSWORD: heyriz
      POSTGRES_DB: heyriz
    ports:
      # Host port 5435: 5434 on this machine is taken by another project's
      # postgres. Services reach postgres at postgres:5432 inside the network.
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: heyriz
      MONGO_INITDB_ROOT_PASSWORD: heyriz
      MONGO_INITDB_DATABASE: heyriz
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  ai_core_node_modules:
  billing_node_modules:
  gateway_node_modules:
  worker_node_modules:
  redis_data:
  postgres_data:
  mongodb_data:
