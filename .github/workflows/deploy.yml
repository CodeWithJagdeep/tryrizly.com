name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:server
        env:
          NODE_ENV: production

      - name: Backend build complete
        if: success()
        run: |
          echo "::info::Backend build successful"
          echo "::notice::Frontend (web/) is auto-deployed to Vercel (getrizly.com)"
          echo "::notice::Backend (gateway/ai-core/worker) ready for manual GCP VM deploy"
          echo ""
          echo "To deploy backend:"
          echo "  ssh heyriz-vm"
          echo "  cd ~/heyriz && git pull origin main"
          echo "  make prod"
          echo ""
          echo "Docs: https://github.com/YOUR_REPO/blob/main/docs/devops.md"
